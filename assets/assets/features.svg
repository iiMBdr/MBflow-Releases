<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-label="Natural detail, smoother motion and your color"><rect width="1200" height="230" fill="#0d0e0f"/><g transform="translate(8,8)"><rect width="384" height="210" rx="15" fill="#121314" stroke="#303132"/><text x="26" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#888">01 / DETAIL</text><text x="26" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#f5f5f5">Keep it natural.</text><text x="26" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Real DLSS NR + SR.</text><text x="26" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Protected highlights.</text></g><g transform="translate(408,8)"><rect width="384" height="210" rx="15" fill="#121314" stroke="#303132"/><text x="26" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#888">02 / MOTION</text><text x="26" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#f5f5f5">Let it flow.</text><text x="26" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Motion-aware blur.</text><text x="26" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Static HUD protection.</text></g><g transform="translate(808,8)"><rect width="384" height="210" rx="15" fill="#121314" stroke="#303132"/><text x="26" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#888">03 / COLOR</text><text x="26" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#f5f5f5">Make it yours.</text><text x="26" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Adjustable Vibrance.</text><text x="26" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#aaa">Controlled sharpening.</text></g></svg>